# Shared analyzer configuration for every package in the ACK workspace.
#
# Each package includes this file via `include: ../../analysis_options.yaml`
# (or `../analysis_options.yaml` for top-level packages such as `example`).
# Package-specific tweaks belong in each package's own analysis_options.yaml
# as overrides on top of this include. The presets and the bitwild_lints
# plugin come from https://github.com/btwld/lints.
include:
  - package:bitwild_analysis/dart.yaml
  - package:bitwild_analysis/plugin.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.mocks.dart"
  # ack, ack_generator, the example and the scripts don't pass the strict
  # modes yet (about 60 diagnostics, mostly raw generic types). The packages
  # that already used them turn them back on.
  language:
    strict-casts: false
    strict-inference: false
    strict-raw-types: false

linter:
  rules:
    # Long strings in lists are wrapped as adjacent strings, and
    # unnecessary_parenthesis rejects the parentheses this rule asks for.
    # bitwild_analysis 0.4.0 drops it from the preset.
    no_adjacent_strings_in_list: false
