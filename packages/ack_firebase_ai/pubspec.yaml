name: ack_firebase_ai
description: Firebase AI (Gemini) schema converter for the Ack validation library
version: 1.6.0
repository: https://github.com/conceptadev/ack
issue_tracker: https://github.com/conceptadev/ack/issues
resolution: workspace
topics:
  - firebase
  - gemini
  - ai
  - schema
  - validation

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  ack: ^1.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  # Keep the generated Firebase fixture and its compile-time SDK matrix exact.
  firebase_ai: 3.12.2
  firebase_app_check: 0.4.5
  firebase_auth: 6.5.4
  firebase_core: 4.11.0
  firebase_core_platform_interface: 7.1.0
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  test: ^1.25.15
