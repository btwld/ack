name: ack_annotations
description: Compatibility re-exports for Ack schema-generation annotations
version: 1.7.0-beta.2
repository: https://github.com/btwld/ack
resolution: workspace
topics:
  - annotations
  - codegen
  - validation
  - schema

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  ack: ^1.7.0-beta.2

dev_dependencies:
  # Every sibling package declares lints, so the shared analysis_options.yaml
  # include also resolves when this package is analyzed outside the workspace.
  lints: ^5.0.0
  test: ^1.25.15
