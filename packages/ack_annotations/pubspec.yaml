name: ack_annotations
description: Annotations for Ack schema-first models and class-first schema generation
version: 1.6.2
repository: https://github.com/conceptadev/ack
resolution: workspace
topics:
  - annotations
  - codegen
  - validation
  - schema

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  json_annotation: ^4.12.0
  meta: ^1.15.0

dev_dependencies:
  # Every sibling package declares lints, so the shared analysis_options.yaml
  # include also resolves when this package is analyzed outside the workspace.
  lints: ^5.0.0
  test: ^1.25.15
