name: ack_generator
description: Generates immutable models from Ack schemas and validated schemas from Dart classes
version: 1.6.2
repository: https://github.com/conceptadev/ack
issue_tracker: https://github.com/conceptadev/ack/issues
resolution: workspace
topics:
  - codegen
  - build-runner
  - validation
  - schema

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  # Core code generation dependencies
  analyzer: ">=10.0.0 <11.0.0"
  build: ^4.0.0
  build_config: ^1.3.0
  source_gen: ^4.2.4
  code_builder: ^4.10.0
  collection: ^1.18.0
  dart_style: ^3.1.0
  json_annotation: ^4.12.0
  json_serializable: ^6.14.1
  logging: ^1.3.0
  meta: ^1.15.0

  # Ack packages (versions are overridden locally by Melos)
  ack: ^1.5.0
  ack_annotations: ^1.4.0

dev_dependencies:
  build_runner: ^2.1.7
  build_test: ^3.1.0
  test: ^1.25.15
  path: ^1.9.0
  # Code quality
  lints: ^5.0.0
