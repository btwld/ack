name: ack_generator
description: Generates immutable models from Ack schemas and validated schemas from Dart classes
version: 2.0.0-alpha.1
repository: https://github.com/btwld/ack
issue_tracker: https://github.com/btwld/ack/issues
resolution: workspace
topics:
  - codegen
  - build-runner
  - validation
  - schema

environment:
  sdk: '>=3.14.0-315.1.beta <4.0.0'


dependencies:
  # Core code generation dependencies
  analyzer: ">=14.3.0 <15.0.0"
  # Stay on build 4 while json_serializable's interoperability fixture requires
  # it; build_runner 2.17.1 and build_test 3.5.23 require build 5.
  build: ^4.0.11
  source_gen: ^4.3.1
  code_builder: ^4.10.0
  dart_style: ^3.1.14
  pub_semver: ^2.1.4

  # Workspace resolution selects the local Ack package during development.
  ack: ^2.0.0-alpha.1

dev_dependencies:
  build_runner: ^2.16.2
  build_test: ^3.5.21
  json_annotation: ^4.12.0
  json_serializable: ^6.14.1
  # 6.14.1 does not compile against source_helper 1.4.0. The build fixtures
  # pub get --offline, so this bound has to be in the cache.
  source_helper: '>=1.3.10 <1.4.0'
  logging: ^1.3.0
  test: ^1.25.15
  path: ^1.9.0
  # Code quality
  lints: ^6.1.0
