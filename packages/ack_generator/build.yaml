builders:
  ack_generator:
    import: "package:ack_generator/builder.dart"
    builder_factories: ["ackGenerator"]
    build_extensions: {".dart": [".ack.g.part"]}
    auto_apply: dependents
    build_to: cache
    applies_builders: ["source_gen|combining_builder"]

  ack_json_schema:
    import: "package:ack_generator/builder.dart"
    builder_factories: ["ackJsonSchemaBuilder"]
    build_extensions: {".schema.json": [".schema.dart"]}
    auto_apply: none
    build_to: source
    runs_before: ["ack_generator:ack_generator"]
    defaults:
      options:
        unknown_properties: schema
